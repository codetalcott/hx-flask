name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install flask pytest playwright
      - run: playwright install --with-deps chromium
      - run: pytest -q
      - run: flask --app app hx lint templates
      - run: flask --app app hx map

  ci:
    # The one check branch protection requires. Editing the matrix above cannot
    # silently drop a required check, or leave one pinned by name that never
    # reports and blocks the pull request forever.
    name: ci
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
