{% extends 'layout.html' %}

{% block content %}

<h1>{{contact.first}} {{contact.last}}</h1>

<div>
    <div>Phone: {{contact.phone}}</div>
    <div>Email: {{contact.email}}</div>
</div>

<p>
    <a href="{{ url_for('contacts_edit_get', contact_id=contact.id) }}">Edit</a>
    <a href="{{ url_for('contacts') }}">Back</a>
</p>

{% endblock %}
